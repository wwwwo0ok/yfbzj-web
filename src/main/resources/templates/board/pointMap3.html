		               axisLabel: { fontSize: 14, color: '#66ccff' },                // 标签文字蓝色，字号14
		               axisTick: { lineStyle: { color: '#3399ff' } }                  // 刻度线蓝色
		           },
		           yAxis: { 
		               type: 'value', 
		               name: '台',
		               nameTextStyle: { fontSize: 14, color: '#66ccff' },             // 轴名称蓝色
		               axisLine: { lineStyle: { color: '#3399ff' } },                 // Y轴线蓝色
		               axisLabel: { fontSize: 14, color: '#66ccff' },                 // 标签蓝色
		               axisTick: { lineStyle: { color: '#3399ff' } },                 // 刻度线蓝色
		               splitLine: { show: false }                                    // 去掉横向网格线
		           },
		           series: [{ 
		               type: 'line',
		               data: [],
		               smooth: false,
		               itemStyle: { color: '#33aaff' },               // 数据点颜色
		               lineStyle: { color: '#33aaff', width: 2 },     // 折线颜色
		               label: {
		                   show: true,
		                   position: 'top',
		                   fontSize: 13,
		                   color: '#88ddff'                           // 标签文字浅蓝
		               }
		           }]
		       });
		   }
		  initChart();
		   
		  function updateChart(data) {
		              if (!onlineChart) {
		                  console.warn('请先调用 initChart()');
		                  return;
		              }
		              // 提取 x 轴数据（键）和 y 轴数据（值）
		              let dates = Object.keys(data);
		              let values = Object.values(data);

		              // 推荐对日期排序（如果你的日期不是自然顺序，比如 "4-11","4-12","4-13" 本身顺序正确，但为了安全可以排序）
		              // 这里假设日期格式是 "M-D"，可以转成 Date 排序
		              const sorted = dates.map((date, idx) => ({ date, value: values[idx] }))
		                  .sort((a, b) => {
		                      // 简单将 "4-11" 转成月份和日期数值比较
		                      const [m1, d1] = a.date.split('-').map(Number);
		                      const [m2, d2] = b.date.split('-').map(Number);
		                      return m1 === m2 ? d1 - d2 : m1 - m2;
		                  });
		              dates = sorted.map(item => item.date);
		              values = sorted.map(item => item.value);

		              // 更新图表选项（不会重建实例，只会动态改变数据）
		              onlineChart.setOption({
		                  xAxis: { data: dates },
		                  series: [{ data: values }]
		              });
		          }
		  
		  
		  
		  
			var leftChartDom = document.getElementById('deviceOnline');
						var leftChart = echarts.init(leftChartDom);
						// 2. 准备图表配置项 (您的原始代码)
						var leftOption = {
						  tooltip: {
						    trigger: 'item'
						  },
						  legend: {
						    top: '5%',
						    left: 'center',
						    textStyle: {
						      color: '#00AAD7',
						      fontSize: 20,
						    },
						    // 为了让图例可以点击切换，确保 legend.data 与 series.data 的 name 对应
						    // ECharts 会自动关联，但显式声明是好习惯,在线和离线
						    data: ['在线', '离线'] 
						  },
						  series: [
						    {
						      name: '在线率',
						      type: 'pie',
						      radius: ['40%', '70%'],
						      avoidLabelOverlap: false,
						      color: ['#33FF33', '#1FBBFF',],
						      padAngle: 5,
						      itemStyle: {
						        borderRadius: 10
						      },
						      label: {
						        show: true,
						        position: 'inside',
						        formatter: '{c}',
						        color: 'white',
						        fontSize: 30,
						      },
						      emphasis: {
						        label: {
						          show: true,
						          fontSize: 40,
						          fontWeight: 'bold'
						        }
						      },
						      labelLine: {
						        show: false
						      },
						      data: [
						        { value: 735, name: '离线' },
						        { value: 1048, name: '在线' },
						      ]
						    }
						  ]
						};

						leftOption && leftChart.setOption(leftOption);
			
						
						
			var rightChartDom = document.getElementById('deviceFb');
			var rightChart = echarts.init(rightChartDom);
			var rightOption;

			// 2. 准备图表配置项
			var rightOption = {
			  tooltip: {
			    trigger: 'item'
			  },
			  legend: {
			    top: '5%',
			    left: 'center',
			    textStyle: {
			      color: '#00AAD7',
			      fontSize: 20  // 建议加上字体大小，与左边保持一致
			    },
			    // 显式声明图例数据，确保可以点击切换
			    data: ['电驱', '机械']
			  },
			  series: [
			    {
			      name: '设备类型',  // 改为更准确的名称
			      type: 'pie',
			      radius: ['40%', '70%'],
			      avoidLabelOverlap: false,
			      padAngle: 5,
			      color: ['#004BFF','#4D9900'],
			      itemStyle: {
			        borderRadius: 10
			      },
			      label: {
			        show: true,
			        position: 'inside',
			        formatter: '{c}',
			        color: 'white',
			        fontSize: 30  // 建议加上字体大小
			      },
			      emphasis: {
			        label: {
			          show: true,
			          fontSize: 40,
			          fontWeight: 'bold'
			        }
			      },
			      labelLine: {
			        show: false
			      },
			      data: [
			        { value: 307, name: '电驱' },
			        { value: 1476, name: '机械' },
			      ]
			    }
			  ]
			};

			rightOption && rightChart.setOption(rightOption);


			// 监听左边图表的图例变化
			leftChart.on('legendselectchanged', function (params) {
			    
			    // params.name 是被点击的图例名称 ('在线' 或 '离线')
			    // params.selected 是一个对象，如 { '在线': true, '离线': false }
			    
			    // 更新我们的状态对象
		//	    chartSelectionState.leftChart[params.name] = params.selected[params.name];
				var onlinestatus = [];
				if(params.selected['在线']){
					onlinestatus.push('ONLINE');
				}
				if(params.selected['离线']){
					onlinestatus.push('OFFLINE');
				}
				chartSelectionState.deviceStatusList = onlinestatus;
			    
			    // 打印当前完整的状态
			    
			    // 调用处理函数
			    getDeviceList();
			});

			// 监听右边图表的图例变化
			rightChart.on('legendselectchanged', function (params) {
			    
			    // params.name 是被点击的图例名称 ('监控器' 或 '播种机')
			    // params.selected 是一个对象，如 { '监控器': true, '播种机': false }
			    
			    // 更新我们的状态对象
		//	    chartSelectionState.rightChart[params.name] = params.selected[params.name];
				var deviceTypes = [];
				if(params.selected['电驱']){
					deviceTypes.push(2);
				}
				if(params.selected['机械']){
					deviceTypes.push(1);
				}
				chartSelectionState.deviceTypeList = deviceTypes;
					    
			    // 打印当前完整的状态
			    
			    // 调用处理函数
				getDeviceList();
			});
		


			
			
			
			
			//刷新页面
			var refreshPage = function(){
				
				
				// 模拟获取新数据（实际开发中替换为你的 Ajax/Fetch）
					           // 模拟后端返回的数据，每次刷新可能不同
           // 也可以动态增加/减少键值对

	           updateChart(screenData.onlineMap);
				$("#alarmNum").text(0);

					$("#avgLineNum").text(avg);

				const leftData = [

				const rightData = [

							];

		//
			getDeviceList();

	});
