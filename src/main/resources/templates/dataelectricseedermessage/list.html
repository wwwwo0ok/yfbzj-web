<!DOCTYPE html>
<html lang="en" xmlns:sa="http://www.thymeleaf.org/extras/sa-token"
      xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <!--公共模块-->
  <div th:replace="~{layout}"></div>
  <style>
          * {
              margin: 0;
              padding: 0;
              box-sizing: border-box;
          }
          body {
              padding: 24px 16px;
              font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
          }
          /* 主容器 */
          .dashboard-wrapper {
              max-width: 1400px;
              margin: 0 auto;
              background: #fff;
              border-radius: 16px;
              box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
              overflow: hidden;
              padding: 20px 24px 28px 24px;
          }
          /* 折叠面板样式 */
          .layui-collapse {
              border: none;
              background: transparent;
          }
          .layui-colla-item {
              border: 1px solid #e9edf2;
              border-radius: 14px;
              margin-bottom: 24px;
              background-color: #ffffff;
              transition: 0.2s;
              overflow: hidden;
          }
		  .layui-colla-title {
		      display: flex !important;
		      align-items: center !important;      /* 垂直居中 */
		      justify-content: flex-start !important; /* 内容从左侧开始排列 */
		      gap: 10px !important;                /* 箭头与文字间距 */
		      position: relative !important;
		      padding: 14px 22px !important;
		      background-color: #fafdff;
		      font-weight: 600;
		      color: #1e2f3e;
		      border-bottom: 1px solid #eef2f8;
		      cursor: pointer;
		  }
		  /* 2. 移除 layui 原有的绝对定位箭头样式，改为普通块级元素 */
		  .layui-colla-title .layui-colla-icon {
		      position: static !important;          /* 取消绝对定位 */
		      transform: none !important;
		      order: 1 !important;                 /* 保证箭头在最左侧 */
		      margin-right: 0 !important;
		      font-size: 14px;                     /* 适当调整箭头大小 */
		  }
		  /* 3. 确保标题文字在箭头右侧，并且不会换行或偏移 */
		  .layui-colla-title .layui-colla-title-text {
		      order: 2 !important;
		      flex: 1 !important;
		      text-align: left;
		  }

          .layui-colla-title:hover {
              background-color: #f5f9ff;
          }
          .layui-colla-content {
              padding: 18px 16px 10px 16px;
              border-top: none;
              background: #ffffff;
          }
          /* 每个属性卡片 - 键值对同行 */
          .attr-card {
              margin-bottom: 16px;
              padding: 0 8px;
          }
          .attr-row {
              background: #f9fafc;
              border-radius: 10px;
              padding: 8px 14px;
              display: flex;
              align-items: center;
              justify-content: space-between;
              flex-wrap: wrap;
              transition: 0.1s;
              border: 1px solid #f0f2f6;
          }
          .attr-label {
              font-size: 13px;
              font-weight: 500;
              color: #4a5b6e;
              background: #eff2f8;
              padding: 4px 12px;
              border-radius: 20px;
              letter-spacing: 0.3px;
              white-space: nowrap;
          }
          .attr-value {
              font-size: 14px;
              font-weight: 500;
              color: #1e2f3e;
              word-break: break-word;
              text-align: right;
              max-width: 70%;
              font-family: monospace;
          }
          /* 响应式：小屏幕下每行两个卡片 */
          @media screen and (max-width: 992px) {
              .layui-col-md6 {
                  width: 50%;
              }
          }
          @media screen and (max-width: 768px) {
              .layui-col-sm12 {
                  width: 100%;
              }
              .attr-value {
                  max-width: 60%;
              }
          }
          /* 辅助文字 */
          .footnote {
              font-size: 12px;
              color: #9aa9b9;
              text-align: right;
              border-top: 1px dashed #e2e8f0;
              padding-top: 14px;
              margin-top: 8px;
          }
          /* 无数据占位 */
          .empty-tip {
              color: #bcc6d4;
              font-style: italic;
              padding: 8px 0;
          }
      </style>
<body>
<div class="panel panel-default operation" hidden>
  <div class="panel-heading title"></div>
<div class="layui-card-body">
	<div class="layui-btn-container">
	    <button  class="layui-btn layui-btn-sm" id="btn_cancel">返回</button>
	  </div>
	<div class="layui-collapse" lay-filter="displayCollapse">
	    <!-- ===================== 通用属性面板 ===================== -->
	    <div class="layui-colla-item">
	        <h2 class="layui-colla-title">📌 通用属性</h2>
	        <div class="layui-colla-content layui-show">
	            <div class="layui-row" id="generalContainer"></div>
	            <div class="footnote">基础作业参数 · 直接影响播种效果</div>
	        </div>
	    </div>
	    <!-- ===================== 专业属性面板 ===================== -->
	    <div class="layui-colla-item">
	        <h2 class="layui-colla-title">⚙️ 专业属性</h2>
	        <div class="layui-colla-content layui-show">
	            <div class="layui-row" id="professionalContainer"></div>
	            <div class="footnote">高级配置 · 电机、传感器、报警阈值等</div>
	        </div>
	    </div>
	    <div class="layui-colla-item">
	        <h2 class="layui-colla-title">📊 行信息</h2>
	        <div class="layui-colla-content layui-show">
				<div class="table-responsive">
					<table class="layui-table" id="lineTable" lay-filter="lineTable" ></table>
				</div>
				<div class="footnote">本次每一行的消息</div>
	        </div>
	    </div>
	    <div class="layui-colla-item">
	        <h2 class="layui-colla-title">⚠️ 报警信息</h2>
	        <div class="layui-colla-content layui-show">
				<div class="table-responsive">
					<table class="layui-table" id="alarmTable" lay-filter="alarmTable"></table>
				</div>
	            <div class="footnote">本次上传的报警信息</div>
	        </div>
	    </div>
	    <div class="layui-colla-item" sa:hasPermission="dataBzjDevice:serviceUser">
	            <h2 class="layui-colla-title">📡 串口数据</h2>
	            <div class="layui-colla-content layui-show">
	                <textarea disabled id="aliyun" class="layui-textarea custom-textarea" placeholder="等待接收串口数据...">
	</textarea>
	                <div class="footnote">本次收到的原始串口数据（只读展示）</div>
	            </div>
	    </div>
	</div>
  
   
  
  </div>
</div>
</div>

<div class="table_div">
  <div id="searchParam" >
    <form class="layui-form ">
      <div class="layui-form-item">
		<div class="layui-input-inline">
            <input type="hidden" name="lotId" id="lotId" class="layui-input"  placeholder="设备id" th:value="${param.lotId}">
        </div>
		<div class="layui-input-inline">
            <input type="hidden" name="lotId" id="lotId" class="layui-input"  placeholder="设备id" th:value="${param.lotId}">
        </div>
        <div class="layui-input-inline">
            <input type="text" readonly class="layui-input" name="createTimeBegin" id="createTimeBegin" placeholder="开始时间">
        </div>
        <div class="layui-input-inline">
            <input type="text" readonly class="layui-input" name="createTimeEnd" id="createTimeEnd" placeholder="结束时间">
        </div>
		<div class="layui-input-inline">
                    <div class="layui-input-inline" >
                        <select id="uploadType" name="uploadType" lay-filter="farmFilter">
                            <option value="">--上传方式--</option>
                            <option value="0">蓝牙连接</option>
                            <option value="1">运行停止</option>
                            <option value="2">物联控制</option>
                            <option value="3">设置改变</option>
                        </select>
                    </div>
			                        </div>
        <div class="layui-input-inline ">
          <button type="submit" class="layui-btn layui-btn-primary"  lay-submit lay-filter="data-search-btn"><i class="layui-icon"></i> 搜 索</button>
        </div>
      </div>
    </form>
  </div>
  <table class="layui-table" id="showTable" lay-filter="showTable" ></table>
</div>
<script type="text/html" id="toolbar">
  <div class="layui-btn-container oper">
    <button class="layui-btn layui-btn-sm" lay-event="refresh">更新数据</button>
  </div>
</script>
<script type="text/html" id="tool">
  <a class="layui-btn layui-btn-xs" lay-event="look">数据详情</a>
  <a class="layui-btn layui-btn-xs" lay-event="reRead">数据校正</a>
</script>

</body>
</html>
<script>
  layui.use(function () {
    var table = layui.table;
    var form = layui.form;
    var layer = layui.layer;
	var laydate = layui.laydate;
	var router = layui.router();
	var lotId = router.search.lotId;
	if (!lotId) {
	     function getUrlParam(name) {
	         var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)");
	         var r = window.location.search.substr(1).match(reg);
	         if (r != null) return decodeURI(r[2]);
	         return null;
	     }
	     lotId = getUrlParam("lotId");
	 }

	var messageId;
	var dictObj = {};
	
    //加载table
    var tableIns1 = table.render({
      elem: '#showTable'
      , contentType: 'application/json'
      , page: true //开启分页
      , url: ctx + 'dataElectricSeederMessage/listByPage' //数据接口
      , method: 'POST'
	  , where:{lotId:lotId}
      , parseData: function (res) { //将原始数据解析成 table 组件所规定的数据
        return {
          "code": res.code, //解析接口状态
          "msg": res.msg, //解析提示文本
          "count": CoreUtil.isEmpty(res.data) ? 0 : res.data.total, //解析数据长度
          "data": CoreUtil.isEmpty(res.data) ? null : res.data.records //解析数据列表
        }
      }
      , cols: [
        [
          {type: 'checkbox', fixed: 'left'},
          {width: 200, field: 'dataTimeString', title: '数据时间', sort: true},
          {width: 120, field: 'uploadType', title: '上传方式', templet : function(item){
  			if (item.uploadType == '0') {
  		          return '  <a class="" >蓝牙连接</a>';
  		      }
  		      if (item.uploadType == '1') {
  		          return '<a class="" >运行停止</a>';
  		      }
  			if (item.uploadType == '2') {
  		          return '  <a class="" >物联控制</a>';
  		      }
  		      if (item.uploadType == '3') {
  		          return '<a class="" >设置改变</a>';
  		      }
  						
		  }},
		  {width: 120, field: 'data1', title: '作物',  templet : function(item){
		  			if (item.data1 == '0') {
		  		          return '  <a class="" >玉米</a>';
		  		      }
		  		      else if (item.data1 == '1') {
		  		          return '<a class="ll" >大豆</a>';
		  		      }
		  		      else if (item.data1 == '2') {
		  		          return '<a class=" " >高粱</a>';
		  		      }
		  		      else if (item.data1 == '3') {
		  		          return '<a class=" " >油菜</a>';
		  		      }
		  		      else if (item.data1 == '4') {
		  		          return '<a class=" " >向日葵</a>';
		  		      }
		  		      else if (item.data1 == '5') {
		  		          return '<a class=" " >棉花</a>';
		  		      }
		  		      else if (item.data1 == '6') {
		  		          return '<a class=" " >甜菜</a>';
		  		      }
		  		      else if (item.data1 == '7') {
		  		          return '<a class=" " >花生</a>';
		  		      }
		  		      else  {
		  		          return '<a class="" >其他</a>';
		  		      }
		  						
		  		  }},
		  {width: 100, field: 'sowMode', title: '播种方式', templet : function(item){
			if (item.sowMode == '0') {
		          return '  <a class="" >单苗带</a>';
		      }
		      else if (item.sowMode == '1') {
		          return '<a class="ll" >双苗带</a>';
		      }
		      else if (item.sowMode == '2') {
		          return '<a class=" " >三苗带</a>';
		      }
		      else  {
		          return '<a class="" >未知</a>';
		      }
						
		  }},
		  {width: 110, field: 'sowLine', title: '播种行数', sort: true},
		  {width: 110, field: 'seedCount', title: '播种数量', sort: true},
		  {width: 140, field: 'sowingWidth', title: '播种幅宽(mm)', sort: true},
		  {width: 160, field: 'sowInterval', title: '株距(Amm/Bmm)', sort: true},
		  {width: 130, field: 'seedCountHectare', title: '每公顷种子数', sort: true},
		  {width: 130, field: 'workedArea', title: '作业面积(亩)', sort: true},
          {width: 220, toolbar: "#tool", title: '操作'}
        ]
      ]
      , toolbar: '#toolbar'
	  ,done:function(res,curr,count){
		
	  }
    });

	tableIns1.reload(	'showTable', {
				    where: {lotId:lotId},
				  });
    //表头工具
    table.on('toolbar(showTable)', function(obj){
      switch(obj.event){
		case 'refresh':
		  refreshData();
		  break;
		case 'comeBack':
			const targetUrl = ctx+"index/dataBzjDevice2";
		    // 直接跳转到新页面
			window.location.href = targetUrl;
		  break;
      };
    });
	
	
	//时间组件
	        laydate.render({
	            elem: '#createTimeBegin'
	            , type: 'datetime'
	        });
	        laydate.render({
	            elem: '#createTimeEnd'
	            , type: 'datetime'
	        });
    //列操作
    table.on('tool(showTable)',function (obj) {
      var data = obj.data;
      switch (obj.event) {
        case 'del':
          var ids=[];
          ids.push(data.id);
          tipDialog(ids);
          break;
        case 'look':
          backshow(data);
          toDisabled();
          break;
        case 'reRead':
          reRead(data);
          toDisabled();
          break;
        case 'edit':
          backshow(data);
          $(".title").html("编辑");
          toUnDisabled();
          break;
      }
    });
	
	var reRead = function(data){
				layer.confirm('重新解析会删除所有消息并且重新生成，确认继续吗？', {
				        btn: ['确定', '关闭'] //按钮
				      }, function(){
						$.ajax({
			                type: 'POST',
			                url: ctx + 'dataBzjDevice/reReadMessage',
			                dataType: "JSON",
			                data: JSON.stringify({id:data.id,lotId:data.lotId}),
			                contentType: "application/json",
			                success: function (res) {
			                    if (res.code == 0) {
			                    } else {
			                        layer.msg(res.msg);
			                        $("#img").click();
			                    }
			                }
			            })

						layer.msg('任务执行中，请稍后查看界面', {icon: 1});
				      }, function(){
				        layer.msg('重新解析已经取消', {icon: 1});
				      });
			}

	var refreshData = function(){
		$.ajax({
            type: 'POST',
            url: ctx + 'dataBzjDevice/refreshData',
            dataType: "JSON",
            data: JSON.stringify({lotId:lotId}),
            contentType: "application/json",
            success: function (res) {
                if (res.code == 0) {
					tableIns1.reload({
					        page: {
					          curr: 1
					        }
					        , where: {lotId:lotId}
					      });
                } else {
                    layer.msg(res.msg);
                    $("#img").click();
                }
            }
        })
		layer.msg('任务执行中，请稍后查看界面', {icon: 1});
		
	}
	var getDictInfo = function(){
		$.ajax({
            type: 'POST',
            url: ctx + 'sysDict/getDict',
            dataType: "JSON",
            data: JSON.stringify(['el_deputy_fert_alarm','machine_fert_alarm','seed_alarm']),
            contentType: "application/json",
            success: function (res) {
                if (res.code == 0) {
					dictObj = res.data;
                } else {
                    layer.msg(res.msg);
                    $("#img").click();
                }
            }
        })
	}
	getDictInfo();
	
    //删除
    var tipDialog=function (ids) {
      layer.open({
        content: "确定要删除么?",
        yes: function(index, layero){
          layer.close(index); //如果设定了yes回调，需进行手工关闭
          CoreUtil.sendDelete(ctx + "dataElectricSeederMessage/delete",ids,function (res) {
            layer.msg(res.msg, {time:1000},function () {
              tableIns1.reload();
            });
          });
        }
      });
    };

    //返回
    $("#btn_cancel").click(function() {
      $(".table_div").show();
      $(".operation").hide();
      return false;
    });

    //监听保存
    form.on('submit(submit)', function(data){
      if(data.field.id===undefined || data.field.id===null || data.field.id===""){
        CoreUtil.sendPost(ctx + "dataElectricSeederMessage/add",data.field,function (res) {
          $(".table_div").show();
          $(".operation").hide();
          tableIns1.reload();
        });
      }else {
        CoreUtil.sendPut(ctx + "dataElectricSeederMessage/update",data.field,function (res) {
          $(".table_div").show();
          $(".operation").hide();
          tableIns1.reload();
        });
      }

      return false;
    });

    // 监听搜索操作
    form.on('submit(data-search-btn)', function (data) {
      //执行搜索重载
      tableIns1.reload({
        page: {
          curr: 1
        }
        , where: data.field
      });
      return false;
    });

	
    //回显
    var backshow = function (data) {
      $(".table_div").hide();
      $(".operation").show();
      $(".title").html("查看");
	  $("#aliyun").val(data.aliyun);
	  const generalIds = ['deviceName', 'sowLine', 'aSowInterval','bSowInterval', 'aHolesNum', 'bHolesNum','sowingWidth', 'sowDistance'];
	  	        
	  	        // 为了方便维护，定义所有字段（完全基于原需求，但只展示文本）
	  	        // 注意：对于单选字段，value 存储原始数字/字符串，通过 options 映射为显示文本
	  	        const fieldsData = [
	  	            // === 通用部分（6项）===
	  	            { id: 'deviceName', label: '设备名称', value: 'BZJ-1234' },
	  	            { id: 'sowLine', label: '播种行数', value: '8' },
	  	            { id: 'aSowInterval', label: 'a组株距', value: '18.5',unit:'mm' },
	  	            { id: 'bSowInterval', label: 'b组株距', value: '18.5',unit:'mm'  },
	  	            { id: 'aHolesNum', label: 'a组孔盘数', value: '36' },
	  	            { id: 'bHolesNum', label: 'b组孔盘数', value: '36' },
	  	            { id: 'sowingWidth', label: '总播种宽度', value: '2400' ,unit:'mm'},
	  	            { id: 'sowDistance', label: '播种距离', value: '1250 m',unit:'m' },
	  	            
	  	            // === 专业属性（其余所有字段）====
	  	            { id: 'dataTime', label: '数据时间', value: '2025-03-21 14:32:06' },
	  	            { id: 'electronicGearRatio', label: '电子齿轮比', value: '1.25' },
	  	            { id: 'bReductionRatio', label: 'B减速比', value: '12.5' },
	  	            { id: 'bSendPulse', label: 'B组脉冲数', value: '2000' },
	  	            { id: 'bRecievePulse', label: 'B反脉冲数', value: '2000' },
	  	            { id: 'aHolesNum', label: 'A组孔盘数', value: '32' },
	  	            { id: 'aSowInterval', label: 'A组株距', value: '20.0 cm' ,unit:'cm'},
	  	            { id: 'aReductionRatio', label: 'A减速比', value: '10.2' },
	  	            { id: 'aSendPulse', label: 'A脉冲数', value: '2000' },
	  	            { id: 'aRecievePulse', label: 'A反脉冲数', value: '2000' },
	  	            // 单选类型（存储0/1等，映射显示文字）
	  	            { id: 'newHeadRepFlag', label: '新头重复', value: '0', options: { '0': '无', '1': '有' } },
	  	            { id: 'shutDownDistanceFlag', label: '限制距离到强制停机', value: '0', options: { '0': '无', '1': '有' } },
	  	            { id: 'seedMotorAlarmFlag', label: '种电机报警', value: '0', options: { '0': '无', '1': '有' } },
	  	            { id: 'encoderModeFlag', label: '编码器取反', value: '1', options: { '0': '无', '1': '有' } },
	  	            { id: 'drivingDirectionFlag', label: '行程开关方向取反', value: '0', options: { '0': '无', '1': '有' } },
	  	            { id: 'hasEncoderFlag', label: '有无编码器', value: '1', options: { '0': '无', '1': '有' } },
	  	            { id: 'realMainFertilizerValue', label: '测试主肥量', value: '120 kg' ,unit:'kg'},
	  	            { id: 'setMainFertilizerValue', label: '设定主肥量', value: '150 kg' ,unit:'kg'},
	  	            { id: 'mainFertilizerRate', label: '主肥系数', value: '1.08' },
	  	            { id: 'realDeputyFertilizerValue', label: '测试口肥量', value: '45 kg',unit:'kg' },
	  	            { id: 'setDeputyFertilizerValue', label: '设定口肥量', value: '50 kg' ,unit:'kg'},
	  	            { id: 'deputyFertilizerRate', label: '口肥系数', value: '0.95' },
	  	            { id: 'lackFertilizerRate', label: '主肥监控缺肥灵敏度', value: '0.8' },
	  	            { id: 'mainFertilizerMonitoringFlag', label: '主肥监控标志', value: '1', options: { '0': '无', '1': '有' } },

	  	            colDiv.appendChild(cardDiv);
	  	            return colDiv;
