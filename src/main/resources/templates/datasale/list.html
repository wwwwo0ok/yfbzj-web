<!DOCTYPE html>
<html lang="en" xmlns:sa="http://www.thymeleaf.org/extras/sa-token"
      xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <!--公共模块-->
  <div th:replace="~{layout}"></div>
<body>
<div class="panel panel-default operation" hidden>
  <div class="panel-heading title"></div>
<div class="layui-card-body">
<form class="layui-form " action="" lay-filter="info">
  <input name="id" hidden/>
    <div class="layui-form-item">
      <label class="layui-form-label">经销商</label>
      <div class="layui-input-block">
        <input type="agent" name="agent" placeholder="请输入经销商" autocomplete="off" class="layui-input disabled">
      </div>
    </div>
      <div class="layui-form-item">
      <label class="layui-form-label">买家</label>
      <div class="layui-input-block">
        <input type="buyer" name="buyer" placeholder="请输入买家" autocomplete="off" class="layui-input disabled">
      </div>
    </div>
      <div class="layui-form-item">
      <label class="layui-form-label">联系电话</label>
      <div class="layui-input-block">
        <input type="phone" name="phone" placeholder="请输入联系电话" autocomplete="off" class="layui-input disabled">
      </div>
    </div>
      <div class="layui-form-item">
      <label class="layui-form-label">机器名称</label>
      <div class="layui-input-block">
        <input type="machineName" name="machineName" placeholder="请输入机器名称" autocomplete="off" class="layui-input disabled">
      </div>
    </div>
      <div class="layui-form-item">
      <label class="layui-form-label">机器型号</label>
      <div class="layui-input-block">
        <input type="machineModel" name="machineModel" placeholder="请输入机器型号" autocomplete="off" class="layui-input disabled">
      </div>
    </div>
      <div class="layui-form-item">
      <label class="layui-form-label">名牌编号</label>
      <div class="layui-input-block">
        <input type="brandNumber" name="brandNumber" placeholder="请输入名牌编号" autocomplete="off" class="layui-input disabled">
      </div>
    </div>
      <div class="layui-form-item">
      <label class="layui-form-label">行数</label>
      <div class="layui-input-block">
        <input type="machineLines" name="machineLines" placeholder="请输入行数" autocomplete="off" class="layui-input disabled">
      </div>
    </div>
      <div class="layui-form-item">
      <label class="layui-form-label">激光喷码</label>
      <div class="layui-input-block">
        <input type="productCode" name="productCode" placeholder="请输入激光喷码" autocomplete="off" class="layui-input disabled">
      </div>
    </div>
      <div class="layui-form-item">
      <label class="layui-form-label">经销商id</label>
      <div class="layui-input-block">
        <input type="agentId" name="agentId" placeholder="请输入经销商id" autocomplete="off" class="layui-input disabled">
      </div>
	  
	  
	  <div class="layui-form-item">
	  	                            <label class="layui-form-label">省</label>
	  	                            <div class="layui-input-inline">
	  	                                <select id="provinceId" name="provinceId" lay-filter="provinceFilter">
	  	                                    <option value=""></option>
	  	                                </select>
	  	                            </div>
	  	                        </div>
	  	<div class="layui-form-item">
	  	                            <label class="layui-form-label">市</label>
	  	                            <div class="layui-input-inline">
	  	                                <select id="cityId" name="cityId"  lay-filter="cityFilter">
	  	                                    <option value=""></option>
	  	                                </select>
	  	                            </div>
	  	                        </div>
	  	<div class="layui-form-item">
	  	                            <label class="layui-form-label">区</label>
	  	                            <div class="layui-input-inline">
	  	                                <select id="countryId" name="countryId"  lay-filter="countryFilter">
	  	                                    <option value=""></option>
	  	                                </select>
	  	                            </div>
	  	                        </div>
    </div>
      <div class="layui-form-item">
      <label class="layui-form-label">地区详情</label>
      <div class="layui-input-block">
        <input type="machineModelId" name="addressInfo" placeholder="请输入地区详情" autocomplete="off" class="layui-input disabled">
      </div>
	  </div>
      <div class="layui-form-item">
      <label class="layui-form-label">型号id</label>
      <div class="layui-input-block">
        <input type="machineModelId" name="machineModelId" placeholder="请输入型号id" autocomplete="off" class="layui-input disabled">
      </div>
    </div>
      <div class="layui-form-item">
      <label class="layui-form-label">商品状态</label>
      <div class="layui-input-block">
        <input type="saleStatus" name="saleStatus" placeholder="请输入商品状态" autocomplete="off" class="layui-input disabled">
      </div>
    </div>
  <div class="layui-form-item">
  <div class="layui-input-block">
    <button type="submit" class="layui-btn" lay-submit="" lay-filter="submit">保存</button>
    <button  class="layui-btn layui-btn-primary" id="btn_cancel">返回</button>
  </div>
</div>
</form>
</div>
</div>

<div class="table_div">
  <div id="searchParam"  sa:hasPermission="dataSale:list">
    <form class="layui-form ">
      <div class="layui-form-item">
        <div class="layui-input-inline">
          <input type="text" name="key" class="layui-input"  autocomplete="off" placeholder="请输入">
        </div>
        <div class="layui-input-inline ">
          <button type="submit" class="layui-btn layui-btn-primary"  lay-submit lay-filter="data-search-btn"><i class="layui-icon"></i> 搜 索</button>
        </div>
      </div>
    </form>
  </div>
  <table class="layui-table" id="showTable" lay-filter="showTable" ></table>
</div>
<script type="text/html" id="toolbar">
  <div class="layui-btn-container oper">
    <button class="layui-btn layui-btn-sm" lay-event="add"  sa:hasPermission="dataSale:add">添加</button>
    <button class="layui-btn layui-btn-sm" lay-event="export"  >导出</button>
	</button>
    <button class="layui-btn layui-btn-sm" lay-event="batchDeleted" sa:hasPermission="dataSale:delete">删除</button>
	<button type="button" class="layui-btn demo-class-accept" lay-options="{accept: 'file'}">
	  <i class="layui-icon layui-icon-upload"></i> 
	  点击导入
  </div>
</script>
<script type="text/html" id="tool">
  <a class="layui-btn layui-btn-xs" lay-event="look">查看</a>
  <a class="layui-btn layui-btn-xs" lay-event="edit" sa:hasPermission="dataSale:update">编辑</a>
  <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del" sa:hasPermission="dataSale:delete">删除</a>
</script>

</body>
</html>
<script>
  layui.use(function () {
    var table = layui.table;
    var form = layui.form;
	var upload = layui.upload;
    var layer = layui.layer;
	var curData = {};

    //加载table
    var tableIns1 = table.render({
      elem: '#showTable'
      , contentType: 'application/json'
      , page: true //开启分页
      , url: ctx + 'dataSale/listByPage' //数据接口
      , method: 'POST'
      , parseData: function (res) { //将原始数据解析成 table 组件所规定的数据
        return {
          "code": res.code, //解析接口状态
          "msg": res.msg, //解析提示文本
          "count": CoreUtil.isEmpty(res.data) ? 0 : res.data.total, //解析数据长度
          "data": CoreUtil.isEmpty(res.data) ? null : res.data.records //解析数据列表
        }
      }
      , cols: [
        [
          {type: 'checkbox', fixed: 'left'},
          {field: 'agent', title: '经销商', sort: true},
          {field: 'buyer', title: '用户', sort: true},
          {width: 140,field: 'phone', title: '联系电话', sort: true},
          {width: 220,field: 'machineName', title: '机器名称', sort: true},
          {width: 110,field: 'machineModel', title: '机器型号', sort: true},
          {width: 80,field: 'machineLines', title: '行数', sort: true},
		  {width: 220,field: 'addressInfo', title: '地区详情', sort: true},
          {width: 80,field: 'saleStatus', title: '状态', sort: true},
          {width: 220, toolbar: "#tool", title: '操作'}
        ]
      ]
      , toolbar: '#toolbar'
    });

	function initAreaForm(){
		resetSelect('city', '请先选择省');
		resetSelect('county', '请先选择市');
		if(curData){
			getCityList(curData.provinceId);
			getCountyList(curData.cityId);
		}
	}
	// 3. 监听市变化 → 加载区/县
	 form.on('select(cityFilter)', function(data) {
	   var cityId = data.value;
	   if (!cityId) {
	     resetSelect('county', '请先选择市');
	     form.render('select');
	     return;
	   }
	   getCountyList(cityId);
	 });
	 

	 initProvince();
	 // 初始化省数据（AJAX）
	   function initProvince() {
	     $.ajax({
	       url: ctx + 'sysArea/getArea', 				
	    contentType: 'application/json', // 明确指定 Content-Type
	    data: JSON.stringify({ parentId: '0' }), // 转换为 JSON 字符串
	       type: 'POST',
	       success: function(res) {
	         if (res.code === 0) {
	           var html = '<option value="">请选择省</option>';
	           $.each(res.data, function(index, item) {
	             html += '<option value="' + item.id + '">' + item.name + '</option>';
	           });
	           $('#provinceId').html(html);
	           form.render('select'); // 重新渲染下拉框
	         } else {
	           layer.msg('加载省数据失败');
	         }
	       },
	       error: function() {
	         layer.msg('请求异常');
	       }
	     });
	   }

	   // 根据省ID加载市数据
	   function getCityList(provinceId) {
	     $.ajax({
	       url: ctx + 'sysArea/getArea', 
	       type: 'POST',
	    contentType: 'application/json', // 明确指定 Content-Type
	    data: JSON.stringify({ parentId: provinceId }), // 转换为 JSON 字符串
	       success: function(res) {
	         if (res.code === 0) {
	           var html = '<option value="">请选择市</option>';
	           $.each(res.data, function(index, item) {
	             html += '<option value="' + item.id + '">' + item.name + '</option>';
	           });
	           $('#cityId').html(html).prop('disabled', false); // 启用市下拉框
	           resetSelect('county', '请先选择市'); // 重置区/县
	           form.render('select');
	         } else {
	           layer.msg('加载市数据失败');
	         }
	       },
	       error: function() {
	         layer.msg('请求异常');
	       }
	     });
	   }

	   // 根据市ID加载区/县数据
	   function getCountyList(cityId) {
	     $.ajax({
	       url: ctx + 'sysArea/getArea', 
	       type: 'POST',
	    contentType: 'application/json', // 明确指定 Content-Type
	    data: JSON.stringify({ parentId: cityId }), // 转换为 JSON 字符串
	       success: function(res) {
	         if (res.code === 0) {
	           var html = '<option value="">请选择区/县</option>';
	           $.each(res.data, function(index, item) {
	             html += '<option value="' + item.id + '">' + item.name + '</option>';
	           });
	           $('#countryId').html(html).prop('disabled', false); // 启用区/县下拉框
	           form.render('select');
	         } else {
	           layer.msg('加载区/县数据失败');
	         }
	       },
	       error: function() {
	         layer.msg('请求异常');
	       }
	     });
	   }

	   // 重置下拉框
	   function resetSelect(selectId, placeholder) {
	     $('#' + selectId).html('<option value="">' + placeholder + '</option>').prop('disabled', true);
	   }

	   // 渲染
	   upload.render({
	     elem: '.demo-class-accept', // 绑定多个元素
	     url: ctx + 'dataSale/import', // 此处配置你自己的上传接口即可
	     accept: 'file', // 普通文件
	     done: function(res){
	       layer.msg('上传成功');
		   //执行搜索重载
		        tableIns1.reload({
		          page: {
		            curr: 1
		          }
		        });
	     }
	   });
	   
	   
    //表头工具
    table.on('toolbar(showTable)', function(obj){
      switch(obj.event){
        case 'batchDeleted':
          var checkStatus = table.checkStatus(obj.config.id);
          var data = checkStatus.data;
          if(data.length==0){
            layer.msg("请选择要批量删除的列");
          }else {
            var ids = [];
            $(data).each(function (index,item) {
              ids.push(item.id);
            });
            tipDialog(ids);
          }
          break;
        case 'add':
          toUnDisabled();
          $(".table_div").hide();
          $(".operation").show();
          $(".title").html("新增");
          setTimeout(function () {
            form.val('info', {
              "test": "test"
              , "id": ""
              , "agent": ""
              , "buyer": ""
              , "phone": ""
              , "machineName": ""
              , "machineModel": ""
              , "brandNumber": ""
              , "machineLines": ""
              , "productCode": ""
              , "agentId": ""
              , "areaId": ""
              , "machineModelId": ""
              , "addressInfo": ""
              , "saleStatus": ""
            });
          }, 200);
          break;
		 case 'export':
		 	exportData();
		 break;
      };
    });
    //列操作
    table.on('tool(showTable)',function (obj) {
      var data = obj.data;
	  curData = data;
      switch (obj.event) {
        case 'del':
          var ids=[];
          ids.push(data.id);
          tipDialog(ids);
          break;
        case 'look':
          backshow(data);
          toDisabled();
          break;
        case 'edit':
		  initAreaForm();
          backshow(data);
          $(".title").html("编辑");
          toUnDisabled();
          break;
      }
    });

    //删除
    var tipDialog=function (ids) {
      layer.open({
        content: "确定要删除么?",
        yes: function(index, layero){
          layer.close(index); //如果设定了yes回调，需进行手工关闭
          CoreUtil.sendDelete(ctx + "dataSale/delete",ids,function (res) {
            layer.msg(res.msg, {time:1000},function () {
              tableIns1.reload();
            });
          });
        }
      });
    };

    //返回
    $("#btn_cancel").click(function() {
      $(".table_div").show();
      $(".operation").hide();
      return false;
    });

    //监听保存
    form.on('submit(submit)', function(data){
      if(data.field.id===undefined || data.field.id===null || data.field.id===""){
        CoreUtil.sendPost(ctx + "dataSale/add",data.field,function (res) {
          $(".table_div").show();
          $(".operation").hide();
          tableIns1.reload();
        });
      }else {
        CoreUtil.sendPut(ctx + "dataSale/update",data.field,function (res) {
          $(".table_div").show();
          $(".operation").hide();
          tableIns1.reload();
        });
      }

      return false;
    });

    // 监听搜索操作
    form.on('submit(data-search-btn)', function (data) {
      //执行搜索重载
      tableIns1.reload({
        page: {
          curr: 1
        }
        , where: data.field
      });
      return false;
    });

    //回显
    var backshow = function (data) {
      $(".table_div").hide();
      $(".operation").show();
      $(".title").html("查看");
      setTimeout(function () {
        form.val('info', {
          "test": "test"
                      , "id": data.id
                      , "agent": data.agent
                      , "buyer": data.buyer
                      , "phone": data.phone
                      , "machineName": data.machineName
                      , "machineModel": data.machineModel
                      , "brandNumber": data.brandNumber
                      , "machineLines": data.machineLines
                      , "productCode": data.productCode
                      , "agentId": data.agentId
                      , "areaId": data.areaId
                      , "machineModelId": data.machineModelId
                      , "addressInfo": data.addressInfo
                      , "saleStatus": data.saleStatus
                      , "provinceId": data.provinceId
                      , "cityId": data.cityId
                      , "countryId": data.countryId
                  });
      }, 200);
    }

    //禁用输入
    var toDisabled = function () {
      $(".oper").hide();
      $(".disabled").each(function (index, elem) {
        $(elem).attr("disabled", "")
      })
    }

    //放开输入
    var toUnDisabled = function () {
      $(".oper").show();
      $(".disabled").each(function (index, elem) {
        $(elem).removeAttr("disabled", "")
      })
    }
	// 导出方法
	function exportData() {
	    // 动态创建一个隐藏的 form 表单
	    var form = $('<form></form>');
	    form.attr('method', 'post');
	    form.attr('action', ctx + 'dataSale/export'); // 根据实际后端路径调整
	    form.attr('style', 'display:none');

	    // 如果需要传递额外参数（如查询条件），可以添加隐藏字段
	    // 示例：form.append('<input type="hidden" name="startTime" value="2024-01-01">');

	    // 将表单附加到 body 并提交
	    $('body').append(form);
	    form.submit();
	    form.remove(); // 提交后移除
	}
	// 导出方法
	function importData() {
	    // 动态创建一个隐藏的 form 表单
	    var form = $('<form></form>');
	    form.attr('method', 'post');
	    form.attr('action', ctx + 'dataSale/export'); // 根据实际后端路径调整
	    form.attr('style', 'display:none');

	    // 如果需要传递额外参数（如查询条件），可以添加隐藏字段
	    // 示例：form.append('<input type="hidden" name="startTime" value="2024-01-01">');

	    // 将表单附加到 body 并提交
	    $('body').append(form);
	    form.submit();
	    form.remove(); // 提交后移除
	}
	
	
	// 暴露到全局的 export 方法
	});
</script>
