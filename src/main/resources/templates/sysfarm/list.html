<!DOCTYPE html>
<html lang="en" xmlns:sa="http://www.thymeleaf.org/extras/sa-token"
      xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <!--公共模块-->
  <div th:replace="~{layout}"></div>
<body>
<div class="panel panel-default operation" hidden>
  <div class="panel-heading title"></div>
<div class="layui-card-body">
<form class="layui-form " action="" lay-filter="info">
  <input name="id" hidden/>
    <div class="layui-form-item">
      <label class="layui-form-label">手机号</label>
      <div class="layui-input-block">
        <input type="phone" name="phone" placeholder="请输入手机号" autocomplete="off" class="layui-input disabled">
      </div>
    </div>
	<div class="layui-form-item">
	                            <label class="layui-form-label">省</label>
	                            <div class="layui-input-inline">
	                                <select id="provinceId" name="provinceId" lay-filter="provinceFilter">
	                                    <option value=""></option>
	                                    <option value="0">写作</option>
	                                    <option value="1">阅读</option>
	                                    <option value="2">游戏</option>
	                                    <option value="3">音乐</option>
	                                    <option value="4">旅行</option>
	                                </select>
	                            </div>
	                        </div>
	<div class="layui-form-item">
	                            <label class="layui-form-label">市</label>
	                            <div class="layui-input-inline">
	                                <select id="cityId" name="cityId"  lay-filter="cityFilter">
	                                    <option value=""></option>
	                                    <option value="0">写作</option>
	                                    <option value="1">阅读</option>
	                                    <option value="2">游戏</option>
	                                    <option value="3">音乐</option>
	                                    <option value="4">旅行</option>
	                                </select>
	                            </div>
	                        </div>
	<div class="layui-form-item">
	                            <label class="layui-form-label">区</label>
	                            <div class="layui-input-inline">
	                                <select id="countryId" name="countryId"  lay-filter="countryFilter">
	                                    <option value=""></option>
	                                    <option value="0">写作</option>
	                                    <option value="1">阅读</option>
	                                    <option value="2">游戏</option>
	                                    <option value="3">音乐</option>
	                                    <option value="4">旅行</option>
	                                </select>
	                            </div>
	                        </div>
      <div class="layui-form-item">
      <label class="layui-form-label">农场名称</label>
      <div class="layui-input-block">
        <input type="name" name="name" placeholder="请输入农场名称" autocomplete="off" class="layui-input disabled">
      </div>
    </div>
      <div class="layui-form-item">
      <label class="layui-form-label">户主名称</label>
      <div class="layui-input-block">
        <input type="ownerName" name="ownerName" placeholder="请输入户主名称" autocomplete="off" class="layui-input disabled">
      </div>
    </div>
  <div class="layui-form-item">
  <div class="layui-input-block">
    <button type="submit" class="layui-btn" lay-submit="" lay-filter="submit">保存</button>
    <button  class="layui-btn layui-btn-primary" id="btn_cancel">返回</button>
  </div>
</div>
</form>
</div>
</div>

<div class="table_div">
  <div id="searchParam"  sa:hasPermission="sysFarm:list">
    <form class="layui-form ">
      <div class="layui-form-item">
        <div class="layui-input-inline">
          <input type="text" name="key" class="layui-input"  autocomplete="off" placeholder="请输入">
        </div>
        <div class="layui-input-inline ">
          <button type="submit" class="layui-btn layui-btn-primary"  lay-submit lay-filter="data-search-btn"><i class="layui-icon"></i> 搜 索</button>
        </div>
      </div>
    </form>
  </div>
  <table class="layui-table" id="showTable" lay-filter="showTable" ></table>
</div>
<script type="text/html" id="toolbar">
  <div class="layui-btn-container oper">
    <button class="layui-btn layui-btn-sm" lay-event="add"  sa:hasPermission="sysFarm:add">添加</button>
    <button class="layui-btn layui-btn-sm" lay-event="batchDeleted" sa:hasPermission="sysFarm:delete">删除</button>
  </div>
</script>
<script type="text/html" id="tool">
  <a class="layui-btn layui-btn-xs" lay-event="look">查看</a>
  <a class="layui-btn layui-btn-xs" lay-event="edit" sa:hasPermission="sysFarm:update">编辑</a>
  <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del" sa:hasPermission="sysFarm:delete">删除</a>
</script>

</body>
</html>
<script>
  layui.use(function () {
    var table = layui.table;
    var form = layui.form;
    var layer = layui.layer;
	var curObj;
    //加载table
    var tableIns1 = table.render({
      elem: '#showTable'
      , contentType: 'application/json'
      , page: true //开启分页
      , url: ctx + 'sysFarm/listByPage' //数据接口
      , method: 'POST'
      , parseData: function (res) { //将原始数据解析成 table 组件所规定的数据
        return {
          "code": res.code, //解析接口状态
          "msg": res.msg, //解析提示文本
          "count": CoreUtil.isEmpty(res.data) ? 0 : res.data.total, //解析数据长度
          "data": CoreUtil.isEmpty(res.data) ? null : res.data.records //解析数据列表
        }
      }
      , cols: [
        [
          {type: 'checkbox', fixed: 'left'},
          {field: 'id', title: '', sort: true},
          {field: 'phone', title: '手机号', sort: true},
          {field: 'provinceName', title: '省', sort: true},
          {field: 'cityName', title: '市', sort: true},
          {field: 'countryName', title: '区', sort: true},
          {field: 'name', title: '农场名称', sort: true},
          {field: 'ownerName', title: '户主名称', sort: true},
          {width: 220, toolbar: "#tool", title: '操作'}
        ]
      ]
      , toolbar: '#toolbar'
    });


    //表头工具
    table.on('toolbar(showTable)', function(obj){
      switch(obj.event){
        case 'batchDeleted':
          var checkStatus = table.checkStatus(obj.config.id);
          var data = checkStatus.data;
          if(data.length==0){
            layer.msg("请选择要批量删除的列");
          }else {
            var ids = [];
            $(data).each(function (index,item) {
              ids.push(item.id);
            });
            tipDialog(ids);
          }
          break;
        case 'add':
          toUnDisabled();
          $(".table_div").hide();
          $(".operation").show();
          $(".title").html("新增");
          setTimeout(function () {
            form.val('info', {
              "test": "test"
              , "id": ""
              , "phone": ""
              , "provinceId": ""
              , "cityId": ""
              , "countryId": ""
              , "name": ""
              , "ownerName": ""
            });
          }, 200);
          break;
      };
    });
    //列操作
    table.on('tool(showTable)',function (obj) {
      var data = obj.data;
	  curData = data;
      switch (obj.event) {
        case 'del':
          var ids=[];
          ids.push(data.id);
          tipDialog(ids);
          break;
        case 'look':
		  initAreaForm();
          backshow(data);
          toDisabled();
          break;
        case 'edit':
		  initAreaForm();
          backshow(data);
          $(".title").html("编辑");
          toUnDisabled();
          break;
      }
    });

	function initAreaForm(){
		resetSelect('city', '请先选择省');
		resetSelect('county', '请先选择市');
		if(curData){
			getCityList(curData.provinceId);
			getCountyList(curData.cityId);
		}
	}
	
	// 2. 监听省变化 → 加载市
	 form.on('select(provinceFilter)', function(data) {
	   var provinceId = data.value;
	   if (!provinceId) {
	     resetSelect('city', '请先选择省');
	     resetSelect('county', '请先选择市');
	     form.render('select');
	     return;
	   }
	   getCityList(provinceId);
	 });
	
	 // 3. 监听市变化 → 加载区/县
	 form.on('select(cityFilter)', function(data) {
	   var cityId = data.value;
	   if (!cityId) {
	     resetSelect('county', '请先选择市');
	     form.render('select');
	     return;
	   }
	   getCountyList(cityId);
	 });
	
	
		 initProvince();
		 // 初始化省数据（AJAX）
		   function initProvince() {
		     $.ajax({
		       url: ctx + 'sysArea/getArea', 				
			   contentType: 'application/json', // 明确指定 Content-Type
			   data: JSON.stringify({ parentId: '0' }), // 转换为 JSON 字符串
		       type: 'POST',
		       success: function(res) {
		         if (res.code === 0) {
		           var html = '<option value="">请选择省</option>';
		           $.each(res.data, function(index, item) {
		             html += '<option value="' + item.id + '">' + item.name + '</option>';
		           });
		           $('#provinceId').html(html);
		           form.render('select'); // 重新渲染下拉框
		         } else {
		           layer.msg('加载省数据失败');
		         }
		       },
		       error: function() {
		         layer.msg('请求异常');
		       }
		     });
		   }

		   // 根据省ID加载市数据
		   function getCityList(provinceId) {
		     $.ajax({
		       url: ctx + 'sysArea/getArea', 
		       type: 'POST',
			   contentType: 'application/json', // 明确指定 Content-Type
			   data: JSON.stringify({ parentId: provinceId }), // 转换为 JSON 字符串
		       success: function(res) {
		         if (res.code === 0) {
		           var html = '<option value="">请选择市</option>';
		           $.each(res.data, function(index, item) {
		             html += '<option value="' + item.id + '">' + item.name + '</option>';
		           });
		           $('#cityId').html(html).prop('disabled', false); // 启用市下拉框
		           resetSelect('county', '请先选择市'); // 重置区/县
		           form.render('select');
		         } else {
		           layer.msg('加载市数据失败');
		         }
		       },
		       error: function() {
		         layer.msg('请求异常');
		       }
		     });
		   }

		   // 根据市ID加载区/县数据
		   function getCountyList(cityId) {
		     $.ajax({
		       url: ctx + 'sysArea/getArea', 
		       type: 'POST',
			   contentType: 'application/json', // 明确指定 Content-Type
			   data: JSON.stringify({ parentId: cityId }), // 转换为 JSON 字符串
		       success: function(res) {
		         if (res.code === 0) {
		           var html = '<option value="">请选择区/县</option>';
		           $.each(res.data, function(index, item) {
		             html += '<option value="' + item.id + '">' + item.name + '</option>';
		           });
		           $('#countryId').html(html).prop('disabled', false); // 启用区/县下拉框
		           form.render('select');
		         } else {
		           layer.msg('加载区/县数据失败');
		         }
		       },
		       error: function() {
		         layer.msg('请求异常');
		       }
		     });
		   }

		   // 重置下拉框
		   function resetSelect(selectId, placeholder) {
		     $('#' + selectId).html('<option value="">' + placeholder + '</option>').prop('disabled', true);
		   }
	
	
	
	
    //删除
    var tipDialog=function (ids) {
      layer.open({
        content: "确定要删除么?",
        yes: function(index, layero){
          layer.close(index); //如果设定了yes回调，需进行手工关闭
          CoreUtil.sendDelete(ctx + "sysFarm/delete",ids,function (res) {
            layer.msg(res.msg, {time:1000},function () {
              tableIns1.reload();
            });
          });
        }
      });
    };

    //返回
    $("#btn_cancel").click(function() {
      $(".table_div").show();
      $(".operation").hide();
      return false;
    });

    //监听保存
    form.on('submit(submit)', function(data){
      if(data.field.id===undefined || data.field.id===null || data.field.id===""){
        CoreUtil.sendPost(ctx + "sysFarm/add",data.field,function (res) {
          $(".table_div").show();
          $(".operation").hide();
          tableIns1.reload();
        });
      }else {
        CoreUtil.sendPut(ctx + "sysFarm/update",data.field,function (res) {
          $(".table_div").show();
          $(".operation").hide();
          tableIns1.reload();
        });
      }

      return false;
    });

    // 监听搜索操作
    form.on('submit(data-search-btn)', function (data) {
      //执行搜索重载
      tableIns1.reload({
        page: {
          curr: 1
        }
        , where: data.field
      });
      return false;
    });

    //回显
    var backshow = function (data) {
      $(".table_div").hide();
      $(".operation").show();
      $(".title").html("查看");
      setTimeout(function () {
        form.val('info', {
          "test": "test"
                      , "id": data.id
                      , "phone": data.phone
                      , "provinceId": data.provinceId
                      , "cityId": data.cityId
                      , "countryId": data.countryId
                      , "name": data.name
                      , "ownerName": data.ownerName
                  });
      }, 200);
    }

    //禁用输入
    var toDisabled = function () {
      $(".oper").hide();
      $(".disabled").each(function (index, elem) {
        $(elem).attr("disabled", "")
      })
    }

    //放开输入
    var toUnDisabled = function () {
      $(".oper").show();
      $(".disabled").each(function (index, elem) {
        $(elem).removeAttr("disabled", "")
      })
    }
  });
</script>
