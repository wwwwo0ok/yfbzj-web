<!DOCTYPE html>
<html lang="en" xmlns:sa="http://www.thymeleaf.org/extras/sa-token"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>大屏显示 - 店铺地图</title>
    <!-- 引入 ECharts 库 -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <!-- 引入中国地图数据 -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/map/js/china.js"></script>
    <!-- 引入 jQuery（如果你已经引入可以省略） -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
    <!-- 引入 ECharts 扩展：BMap（百度地图扩展，用于更详细的街道地图） -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/extension/bmap.min.js"></script>
    <!-- 引入百度地图API（需要申请AK） -->
    <script src="https://api.map.baidu.com/api?v=3.0&ak=6Huz8qCYdn58and6nmuhVEugk0XgEL7A"></script>
    <style>
        #map-container {
            width: 100%;
            height: 800px;
            margin: 0 auto;
        }
        .table_div {
            padding: 20px;
        }
    </style>
</head>
<body>
<div class="table_div">
    <h5>店铺分布地图</h5>
    <!-- 地图容器 -->
    <div id="map-container"></div>
</div>

<script>
// 初始化地图
$(document).ready(function() {
    // 初始化ECharts实例
    var myChart = echarts.init(document.getElementById('map-container'));
    
    // 模拟店铺数据（实际项目中应该从后端API获取）
    var shopData = [
        {name: "北京旗舰店", value: [116.404, 39.915, 100], address: "北京市朝阳区建国路87号"},
        {name: "上海分店", value: [121.474, 31.230, 80], address: "上海市黄浦区南京东路829号"},
        {name: "广州店", value: [113.264, 23.129, 70], address: "广州市天河区天河路208号"},
        {name: "深圳店", value: [114.058, 22.544, 90], address: "深圳市福田区福华三路118号"},
        {name: "成都店", value: [104.066, 30.657, 60], address: "成都市锦江区红星路三段1号"}
    ];
    
    // 配置项
    var option = {
        // 标题
        title: {
            text: '全国店铺分布图',
            left: 'center'
        },
        // 工具箱
        toolbox: {
            show: true,
            feature: {
                dataView: {readOnly: true},
                restore: {},
                saveAsImage: {}
            }
        },
        // 提示框
        tooltip: {
            trigger: 'item',
            formatter: function(params) {
                if (params.seriesType === 'scatter') {
                    return params.name + '<br/>地址: ' + params.data.address;
                }
                return params.name;
            }
        },
        // 百度地图配置（使用BMap扩展）
        bmap: {
            center: [104.114129, 37.550339], // 中国中心点坐标
            zoom: 5, // 初始缩放级别
            roam: true, // 允许缩放和平移
            mapStyle: {
                styleJson: [{
                    'featureType': 'water',
                    'elementType': 'all',
                    'stylers': {
                        'color': '#d1d1d1'
                    }
                }, {
                    'featureType': 'land',
                    'elementType': 'all',
                    'stylers': {
                        'color': '#f3f3f3'
                    }
                }, {
                    'featureType': 'railway',
                    'elementType': 'all',
                    'stylers': {
                        'visibility': 'off'
                    }
                }, {
                    'featureType': 'highway',
                    'elementType': 'all',
                    'stylers': {
                        'color': '#fdfdfd'
                    }
                }, {
                    'featureType': 'highway',
                    'elementType': 'labels',
                    'stylers': {
                        'visibility': 'off'
                    }
                }, {
                    'featureType': 'arterial',
                    'elementType': 'geometry',
                    'stylers': {
                        'color': '#fefefe'
                    }
                }, {
                    'featureType': 'arterial',
                    'elementType': 'geometry.fill',
                    'stylers': {
                        'color': '#fefefe'
                    }
                }, {
                    'featureType': 'poi',
                    'elementType': 'all',
                    'stylers': {
                        'visibility': 'off'
                    }
                }, {
                    'featureType': 'green',
                    'elementType': 'all',
                    'stylers': {
                        'visibility': 'off'
                    }
                }, {
                    'featureType': 'subway',
                    'elementType': 'all',
                    'stylers': {
                        'visibility': 'off'
                    }
                }, {
                    'featureType': 'manmade',
                    'elementType': 'all',
                    'stylers': {
                        'color': '#d1d1d1'
                    }
                }, {
                    'featureType': 'local',
                    'elementType': 'all',
                    'stylers': {
                        'color': '#d1d1d1'
                    }
                }, {
                    'featureType': 'arterial',
                    'elementType': 'labels',
                    'stylers': {
                        'visibility': 'off'
                    }
                }, {
                    'featureType': 'boundary',
                    'elementType': 'all',
                    'stylers': {
                        'color': '#fefefe'
                    }
                }, {
                    'featureType': 'building',
                    'elementType': 'all',
                    'stylers': {
                        'color': '#d1d1d1'
                    }
                }, {
                    'featureType': 'label',
                    'elementType': 'labels.text.fill',
                    'stylers': {
                        'color': '#999999'
                    }
                }]
            }
        },
        // 系列列表
        series: [
            {
                name: '店铺',
                type: 'scatter',
                coordinateSystem: 'bmap', // 使用百度地图坐标系
                data: shopData,
                symbolSize: function(val) {
                    return val[2] / 10; // 根据值调整点的大小
                },
                encode: {
                    value: 2
                },
                label: {
                    formatter: '{b}',
                    position: 'right',
                    show: false
                },
                emphasis: {
                    label: {
                        show: true
                    }
                },
                itemStyle: {
                    color: '#dd4541'
                }
            }
        ]
    };
    
    // 使用配置项显示图表
    myChart.setOption(option);
    
    // 获取百度地图实例并设置最小最大缩放级别
    var bmap = myChart.getModel().getComponent('bmap').getBMap();
    bmap.setMinZoom(5);  // 最小缩放级别（国家级别）
    bmap.setMaxZoom(20); // 最大缩放级别（街道级别）
    
    // 添加点击事件，点击店铺标记时显示详细信息
    myChart.on('click', function(params) {
        if (params.seriesType === 'scatter') {
            alert('店铺名称: ' + params.name + '\n地址: ' + params.data.address);
        }
    });
    
    // 窗口大小变化时重新调整图表大小
    window.addEventListener('resize', function() {
        myChart.resize();
    });
});
</script>
</body>
</html>
